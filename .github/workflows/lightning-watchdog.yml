name: Paperwise Lightning watchdog

on:
  workflow_dispatch:
  schedule:
    # GitHub schedules are best-effort; this checks roughly every 15 minutes.
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: paperwise-lightning-watchdog
  cancel-in-progress: false

jobs:
  health-and-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Paperwise
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install watchdog dependencies
        run: python -m pip install --upgrade pip lightning-sdk
      - name: Check health and recover if needed
        env:
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
          LIGHTNING_TEAMSPACE: ${{ secrets.LIGHTNING_TEAMSPACE }}
          LIGHTNING_STUDIO: ${{ secrets.LIGHTNING_STUDIO }}
          PAPERWISE_HEALTH_URL: ${{ secrets.PAPERWISE_HEALTH_URL }}
        run: python scripts/lightning_watchdog.py
